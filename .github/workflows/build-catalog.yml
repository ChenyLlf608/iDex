name: Rebuild catalogue

# Regenerates the offline catalogue, sprites and cries for 1..649 and commits
# the result. This runs in CI rather than on a developer machine because the
# generated assets are large and the upstream fetches are slow; committing them
# keeps the app build itself offline.
#
# Simplified Chinese dex entries missing from PokeAPI are fetched from 52poke
# first, so build_catalog.py has them available.

on:
  workflow_dispatch:
    inputs:
      max_species:
        description: Highest national dex number to include
        default: '649'
      refresh_wiki:
        description: Re-fetch Chinese dex entries from 52poke
        type: boolean
        default: true
      commit:
        description: Commit the regenerated assets to this branch
        type: boolean
        default: true

jobs:
  build:
    name: Catalogue, sprites and cries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch Chinese dex entries missing from PokeAPI
        if: ${{ inputs.refresh_wiki }}
        run: |
          python scripts/catalog/fetch_wiki_descriptions.py \
            --max-species "${{ inputs.max_species }}"

      - name: Build catalogue and sprites
        run: |
          python scripts/catalog/build_catalog.py \
            --max-species "${{ inputs.max_species }}"

      - name: Build cries
        run: python scripts/audio/build_cries.py

      - name: Drop the superseded Kanto-only catalogue
        run: git rm -q --ignore-unmatch iDex/Resources/pokemon-kanto.json

      - name: Report
        if: always()
        run: |
          {
            echo "## Catalogue rebuild"
            echo
            python scripts/catalog/report_catalog.py
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A iDex/Resources scripts/catalog/wiki-descriptions.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Rebuild catalogue for 1..${{ inputs.max_species }}

          Generated by the Rebuild catalogue workflow.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload catalogue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue
          path: |
            iDex/Resources/pokemon-catalog.json
            iDex/Resources/sprite-sources.json
            iDex/Resources/Cries/cry-sources.json
            scripts/catalog/wiki-descriptions.json
          if-no-files-found: warn
