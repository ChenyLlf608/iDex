name: Convert full-dex candidate to Core ML

# A 1025-class ViT is an order of magnitude larger than the shipped
# DenseNet121, so the expansion only makes sense if weight compression is close
# to free. Measures each precision the way it would ship and scores it on the
# same sprites, through Core ML rather than PyTorch.
#
# Needs macOS: Core ML prediction and coremlcompiler are not available on Linux.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Hugging Face model id
        default: skshmjn/Pokemon-classifier-gen9-1025
      revision:
        description: Pinned commit on that model
        default: 9e8d54de136b99afc212322eae13ddc07a6fd779
      variants:
        description: Comma-separated weight precisions, cheapest first
        default: fp16,int8,palettize6,palettize4
      install:
        description: Commit one variant as the app's bundled model
        type: boolean
        default: false
      install_variant:
        description: Which variant to bundle
        default: palettize6

jobs:
  convert:
    name: Convert and measure
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The project's pinned conversion stack, plus transformers for the
          # candidate's ViT definition.
          python -m pip install -r scripts/model/requirements.txt
          python -m pip install transformers

      - name: Report toolchain
        run: |
          python -c "import coremltools, torch, transformers; print('coremltools', coremltools.__version__); print('torch', torch.__version__); print('transformers', transformers.__version__)"
          xcrun coremlcompiler version || true

      - name: Convert, compress and score
        run: |
          python scripts/model/convert_gen9.py \
            --repository "${{ inputs.repository }}" \
            --revision "${{ inputs.revision }}" \
            --variants "${{ inputs.variants }}" \
            --output artifacts/gen9-coreml.json

      - name: Summarize
        if: always()
        run: |
          python scripts/model/summarize_coreml.py artifacts/gen9-coreml.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bundle the chosen variant
        if: ${{ inputs.install }}
        run: |
          set -euo pipefail
          source="artifacts/gen9/Gen9Classifier-${{ inputs.install_variant }}.mlpackage"
          test -d "$source" || { echo "::error::$source was not produced"; exit 1; }
          rm -rf iDex/Recognition/NationalClassifier.mlpackage
          cp -R "$source" iDex/Recognition/NationalClassifier.mlpackage
          cp artifacts/gen9/pokemon_labels_gen9.json iDex/Recognition/pokemon_labels.json
          # The Kanto-only model is superseded; leaving it would double the
          # bundle for a model nothing loads.
          git rm -rq --ignore-unmatch iDex/Recognition/KantoClassifier.mlpackage
          du -sh iDex/Recognition/NationalClassifier.mlpackage
          python -c "import json;print(len(json.load(open('iDex/Recognition/pokemon_labels.json'))),'labels')"

      - name: Commit the bundled model
        if: ${{ inputs.install }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A iDex/Recognition
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Bundle the ${{ inputs.install_variant }} full-dex classifier

          Generated by the Convert full-dex candidate workflow from
          ${{ inputs.repository }} at ${{ inputs.revision }}.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload report and labels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen9-coreml-report
          path: |
            artifacts/gen9-coreml.json
            artifacts/gen9/pokemon_labels_gen9.json
          if-no-files-found: warn
